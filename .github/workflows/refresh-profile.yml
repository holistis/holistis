name: Refresh profile evidence

# Recounts merged pull requests and featured repositories from GitHub and rewrites
# the generated parts of this profile (README blocks, assets/hero.svg, data/evidence.json).
# It fails closed: any odd answer from GitHub leaves the last verified profile live.

on:
  workflow_dispatch:
  schedule:
    - cron: "11,41 * * * *"

permissions: {}

concurrency:
  group: refresh-profile
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'holistis/holistis'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Node version
        run: |
          node --version
          node -e "if (Number(process.versions.node.split('.')[0]) < 20) { console.error('Node 20 or newer is required'); process.exit(1); }"

      - name: Tests
        run: node --test scripts/*.test.mjs

      - name: Recount and rewrite
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/refresh.mjs

      - name: Commit only when something changed
        run: |
          if git diff --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/hero.svg data/evidence.json
          git commit -m "chore: refresh profile evidence"
          git pull --rebase origin main
          git push
